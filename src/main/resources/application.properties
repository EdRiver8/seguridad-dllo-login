spring.application.name=ProyectoSeguridadDllologIn

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:dragonballdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Scripts
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# JWT Configuration
# IMPORTANTE: En producción, usar una clave secreta segura y almacenarla en variables de entorno
# Esta clave debe tener al menos 256 bits (32 caracteres) para HS256
jwt.secret=dragonballz-super-secret-key-for-jwt-token-generation-2024-minimum-256-bits
jwt.expiration=86400000
# jwt.expiration en milisegundos: 86400000ms = 24 horas
